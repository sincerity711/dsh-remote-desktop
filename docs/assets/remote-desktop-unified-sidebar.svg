<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Unified local + remote sidebar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1419"/><stop offset="1" stop-color="#151b23"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .label { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c9d1d9; }
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .caption { font: 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .mono { font: 500 17px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #c9d1d9; }
      .muted { fill:#8b949e; } .text { fill:#c9d1d9; } .green { fill:#3fb950; } .blue { fill:#58a6ff; } .orange { fill:#d29922; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="64" y="68" class="title">Unified local + remote sidebar</text>
  <text x="64" y="104" class="caption">Local and remote DSH sessions in one project-first workspace tree.</text>
  <g filter="url(#shadow)">
    
    <rect x="64" y="142" width="1152" height="526" rx="24" fill="#0d1117" stroke="#30363d"/>
    <rect x="64" y="142" width="324" height="526" rx="24" fill="#161b22"/>
    <rect x="388" y="142" width="828" height="526" rx="24" fill="#0b0f14"/>
    <text x="92" y="188" class="label">Workspaces</text>
    <circle cx="342" cy="181" r="12" fill="#21262d" stroke="#30363d"/><path d="M337 181h10M342 176v10" stroke="#c9d1d9" stroke-width="2"/>
    <rect x="86" y="214" width="278" height="40" rx="10" fill="#1f6feb" opacity="0.25"/>
    <text x="112" y="240" class="label">▾ local-app</text>
    <circle cx="328" cy="234" r="5" class="green"/>
    <text x="128" y="280" class="small">● session-home</text>
    <text x="128" y="318" class="small">○ session-build</text>
    <rect x="86" y="344" width="278" height="40" rx="10" fill="#21262d"/>
    <text x="112" y="370" class="label">▾ api-service</text>
    <text x="257" y="370" class="small">remote-a</text><circle cx="336" cy="364" r="5" class="blue"/>
    <text x="128" y="410" class="small">● remote-debug</text>
    <text x="128" y="448" class="small">○ remote-tests</text>
    <rect x="86" y="474" width="278" height="40" rx="10" fill="#21262d"/>
    <text x="112" y="500" class="label">▾ Ungrouped</text>
    <text x="252" y="500" class="small">remote-b</text><circle cx="336" cy="494" r="5" class="orange"/>
    <text x="128" y="540" class="small">○ scratch-session</text>
    <rect x="430" y="184" width="742" height="54" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="458" y="218" class="label">remote-a · api-service · remote-debug</text>
    <rect x="430" y="270" width="742" height="330" rx="18" fill="#0d1117" stroke="#30363d"/>
    <text x="464" y="318" class="mono">$ dsh status --workspace api-service</text>
    <text x="464" y="360" class="mono muted">connected through SSH tunnel · iframe isolated</text>
    <text x="464" y="402" class="mono">✓ remote session opened</text>
    <text x="464" y="444" class="mono">✓ remote workspace actions forwarded</text>
    <text x="464" y="486" class="mono">✓ local sidebar remains in control</text>

  </g>
  <text x="64" y="724" class="small">Synthetic screenshot with anonymized host, user, and workspace names.</text>
</svg>