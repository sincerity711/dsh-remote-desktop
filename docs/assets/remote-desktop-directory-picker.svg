<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Remote workspace directory picker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1419"/><stop offset="1" stop-color="#151b23"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .label { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c9d1d9; }
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .caption { font: 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .mono { font: 500 17px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #c9d1d9; }
      .muted { fill:#8b949e; } .text { fill:#c9d1d9; } .green { fill:#3fb950; } .blue { fill:#58a6ff; } .orange { fill:#d29922; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="64" y="68" class="title">Remote workspace directory picker</text>
  <text x="64" y="104" class="caption">Browse the remote host from home and create a workspace at the selected folder.</text>
  <g filter="url(#shadow)">
    
    <rect x="150" y="132" width="980" height="550" rx="26" fill="#0d1117" stroke="#30363d"/>
    <rect x="150" y="132" width="980" height="74" rx="26" fill="#161b22"/>
    <text x="188" y="178" class="title" style="font-size:26px">Add remote workspace</text>
    <text x="190" y="244" class="small">Host</text>
    <rect x="188" y="260" width="430" height="46" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="212" y="290" class="label">remote-a</text><circle cx="580" cy="283" r="6" class="green"/>
    <rect x="188" y="330" width="904" height="260" rx="18" fill="#161b22" stroke="#30363d"/>
    <rect x="188" y="330" width="904" height="58" rx="18" fill="#0f141b"/>
    <text x="216" y="366" class="label">Home</text><text x="286" y="366" class="small">/</text><text x="312" y="366" class="label">projects</text><text x="404" y="366" class="small">/</text><text x="430" y="366" class="label">api-service</text>
    <rect x="942" y="344" width="126" height="30" rx="8" fill="#21262d" stroke="#30363d"/><text x="964" y="365" class="small">Show hidden</text>
    <rect x="212" y="410" width="856" height="38" rx="10" fill="#21262d"/>
    <text x="240" y="435" class="label">📁 src</text>
    <rect x="212" y="456" width="856" height="38" rx="10" fill="#0d1117"/>
    <text x="240" y="481" class="label">📁 tests</text>
    <rect x="212" y="502" width="856" height="38" rx="10" fill="#0d1117"/>
    <text x="240" y="527" class="label">📁 docs</text>
    <text x="190" y="622" class="mono">/home/user/projects/api-service</text>
    <rect x="828" y="614" width="264" height="44" rx="12" fill="#238636"/><text x="866" y="642" class="label" fill="#fff">Create workspace here</text>

  </g>
  <text x="64" y="724" class="small">Synthetic screenshot with anonymized host, user, and workspace names.</text>
</svg>