<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Remote Desktop settings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1419"/><stop offset="1" stop-color="#151b23"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .label { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c9d1d9; }
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .caption { font: 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .mono { font: 500 17px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #c9d1d9; }
      .muted { fill:#8b949e; } .text { fill:#c9d1d9; } .green { fill:#3fb950; } .blue { fill:#58a6ff; } .orange { fill:#d29922; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="64" y="68" class="title">Remote Desktop settings</text>
  <text x="64" y="104" class="caption">Connect SSH hosts and open a native forwarded remote DSH page when needed.</text>
  <g filter="url(#shadow)">
    
    <rect x="126" y="132" width="1028" height="550" rx="26" fill="#0d1117" stroke="#30363d"/>
    <rect x="126" y="132" width="256" height="550" rx="26" fill="#161b22"/>
    <text x="164" y="184" class="title" style="font-size:25px">Settings</text>
    <rect x="154" y="248" width="200" height="44" rx="12" fill="#1f6feb" opacity="0.25"/>
    <text x="176" y="276" class="label">Remote Desktop</text>
    <text x="422" y="190" class="title" style="font-size:28px">Remote Desktop</text>
    <text x="422" y="226" class="caption">SSH hosts discovered from local config and saved overrides.</text>
    <rect x="422" y="270" width="674" height="94" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="452" y="308" class="label">remote-a</text><text x="452" y="338" class="small">user@host-a · 127.0.0.1:30800</text><circle cx="1026" cy="314" r="7" class="green"/>
    <rect x="734" y="296" width="112" height="36" rx="10" fill="#238636"/><text x="762" y="320" class="label">Open</text>
    <rect x="860" y="296" width="112" height="36" rx="10" fill="#21262d" stroke="#30363d"/><text x="880" y="320" class="label">Disconnect</text>
    <rect x="422" y="388" width="674" height="94" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="452" y="426" class="label">remote-b</text><text x="452" y="456" class="small">user@host-b · 127.0.0.1:30800</text><circle cx="1026" cy="432" r="7" fill="#8b949e"/>
    <rect x="860" y="414" width="112" height="36" rx="10" fill="#21262d" stroke="#30363d"/><text x="882" y="438" class="label">Connect</text>
    <rect x="422" y="528" width="674" height="74" rx="16" fill="#0f141b" stroke="#30363d"/>
    <text x="452" y="570" class="mono">http://127.0.0.1:49231/</text>

  </g>
  <text x="64" y="724" class="small">Synthetic screenshot with anonymized host, user, and workspace names.</text>
</svg>